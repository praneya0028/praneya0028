<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="820" height="180" role="img" aria-label="praneya — little agents at work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1630"/>
      <stop offset="1" stop-color="#0e1620"/>
    </linearGradient>
  </defs>

  <rect width="820" height="180" rx="16" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#f4eeda">
    <circle cx="70" cy="38" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="755" cy="46" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="28" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="150" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name + glowing sun -->
  <text x="410" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" letter-spacing="3" fill="#f4eeda">praneya<tspan fill="#f5b83d"> ☉</tspan></text>

  <!-- blinking cursor -->
  <rect x="556" y="66" width="12" height="30" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- little agents scuttling across the bottom -->
  <g transform="translate(0,150)">
    <rect x="-9" y="-9" width="18" height="16" rx="5" fill="#7A4FD0"/>
    <circle cx="-3.2" cy="-2" r="2" fill="#fff"/><circle cx="3.2" cy="-2" r="2" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="-40,150;860,150" dur="9s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(0,158)">
    <rect x="-8" y="-8" width="16" height="14" rx="4" fill="#22d3ee"/>
    <circle cx="-3" cy="-2" r="1.8" fill="#0e1620"/><circle cx="3" cy="-2" r="1.8" fill="#0e1620"/>
    <animateTransform attributeName="transform" type="translate" values="860,158;-40,158" dur="12s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(0,143)">
    <rect x="-7" y="-7" width="14" height="12" rx="3" fill="#f5b83d"/>
    <circle cx="-2.5" cy="-2" r="1.5" fill="#0e1620"/><circle cx="2.5" cy="-2" r="1.5" fill="#0e1620"/>
    <animateTransform attributeName="transform" type="translate" values="-40,143;860,143" dur="15s" repeatCount="indefinite"/>
  </g>
</svg>
